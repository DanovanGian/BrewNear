<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Cafe Finder</h1>
    <div class="kontrol">
      <label
        >Radius:
        <select id="radius">
          <option value="500">500 m</option>
          <option value="1000" selected>1 km</option>
          <option value="3000">3 km</option>
        </select>
      </label>
      <label><input type="checkbox" id="filter-favorit" /> Favorit saja</label>
    </div>
    <div class="container">
      <div id="map"></div>
      <ul id="daftar-cafe"></ul>
    </div>

    <script src="app.js"></script>
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBJptZX0iIY9ZOJbVjWRnCg7N6WsCsrJU4&callback=initMap&loading=async"
    ></script>
  </body>
</html>
